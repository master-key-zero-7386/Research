<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <meta charset="UTF-8">
    <title>Research Tool</title>

    <!-- DataTables 読み込み -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

</head>

<body style="margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;">
    <div id="loadingOverlay" style="display:none;">
        <div class="overlay-content">
            <div class="spinner"></div>
            <p id="loadingMessage"></p>
        </div>
    </div>    

    <div class="wrap" id="app-root">
        <div class="tabs">
            <a href="/amazon/" class="tabs-title">Research Tool</a>

            <!-- ✅ 共通マーケットプレイス　選択プルダウンメニュー -->
            <div class="global-region" style="display:inline-block; margin-left:12px;">
                <select id="globalRegion" class="select">
                    <option value="US" selected>United States (US)</option>
                    <option value="AU">Australia (AU)</option>
                    <option value="CA">Canada (CA)</option>
                    <option value="SG">Singapore (SG)</option>
                </select>
            </div>            

            <button class="tab active" data-tab="research">リサーチ</button>
            <button class="tab" data-tab="option">オプション</button>

        </div>
    </div>
        


    <!-- ✅ リサーチ -->
    <div id="research" class="tab-content {% if tab == 'research' %}active{% endif %}">
        <div class="card">
            <div class="row">
                <h2>リサーチツール</h2>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <ul class="flash-messages">
                        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
                    </ul>
                    {% endif %}
                {% endwith %}

                <!-- フォーム開始（※ inline style 全廃） -->
                <input type="text" id="output_folder" value="" style="display:none;">
                <input type="hidden" name="tab" value="research">

                <!-- セラーID（プルダウン + トグル + 説明ラベル） -->
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                    <label for="seller_id" style="min-width:50px;">セラーID：</label>
                    <select id="seller_id" name="seller_id" class="select" style="width:500px;" required>
                        <option value="">-- セラーIDを選択 --</option>
                        {% for seller_id, shop_name in seller_list %}
                            <option value="{{ seller_id }}" {% if last_used["seller_id"] == seller_id %}selected{% endif %}>
                                {{ shop_name }}（{{ seller_id }}）
                            </option>
                        {% endfor %}
                    </select>

                    <!-- ✅ 横並びのトグル部分 -->
                    <div style="display:flex; align-items:center; margin-left:12px; gap:24px;">
                        <label class="switch" style="margin:0;">
                            <input type="checkbox" id="toggleHiddenSeller">
                            <span class="slider round"></span>
                        </label>
                        <span style="font-size:13px; color:#555;">非表示のセラーをリストに表示</span>

                        <input id="hidden" name="hidden" type="checkbox" value="TRUE" {% if last_used.hidden == "TRUE" %}checked{% endif %}>
                        <label for="hidden" style="font-size:13px; color:#555; margin:0;">リストから非表示</label>
                    </div>
                </div>
            </div>
            
            <!-- セラーリスト -->
            <div class="row">
                <label class="label"></label>
                <div class="btn-row">
                <button type="button" id="openStoreBtn" class="btn-blue" disabled>ストアを開く</button>
                <button type="button" id="saveSellerBtn" class="btn-blue">保　存</button>
                <button type="button" id="deleteSellerBtn" class="btn-blue">削　除</button>
                </div>
            </div>          

            <!-- セラーID（手入力） -->
            <div class="card"> 
            <div class="row">
                <label class="label" for="manual_seller_id">セラーID（手入力）</label>
                <input id="manual_seller_id" name="manual_seller_id" class="input" value="{{ last_used.manual_seller_id or '' }}">
                <label class="label" for="shop_name">ショップ名</label>
                <input id="shop_name" name="shop_name" class="input" value="{{ last_used.shop_name or '' }}">
                <label class="label" for="remarks">備考</label>
                <input id="remarks" name="remarks" class="input" placeholder="メモや特記事項などを入力" value="{{ last_used.remarks or '' }}">
            </div>
            </div>

            <div class="card">
                <!-- ブランド名 -->
                <div class="row">
                    <label class="label" for="brand">ブランド名：</label>
                    <input id="brand" name="brand" class="input" placeholder="例：Nintendo, Sony" value="{{ last_used.brand or '' }}">
                </div>

                <!-- 最低価格 -->
                <div class="row">
                    <label class="label" for="min_price">最低価格：</label>
                    <input id="min_price" name="min_price" class="input" placeholder="例: 80.0" value="{{ last_used.min_price or '' }}">
                </div>

                <!-- 最高価格 -->
                <div class="row">
                    <label class="label" for="max_price">最高価格：</label>
                    <input id="max_price" name="max_price" class="input" placeholder="例: 250.0" value="{{ last_used.max_price or '' }}">
                </div>

                <!-- ステップ幅 -->
                <div class="row">
                    <label class="label" for="step_price">ステップ幅：</label>
                    <input id="step_price" name="step_price" class="input" placeholder="例: 10.0" value="{{ last_used.step_price or '' }}">
                </div>

                <!-- 自動開始時間 -->
                <div class="row">
                    <label class="label" for="confirm_wait">自動開始 時間：</label>
                    <select id="confirm_wait" name="confirm_wait" class="select">
                    <option value="手動確認" {% if last_used.confirm_wait == "手動確認" %}selected{% endif %}>手動確認</option>
                    <option value="5"  {% if last_used.confirm_wait == "5" %}selected{% endif %}>5秒</option>
                    <option value="10" {% if last_used.confirm_wait == "10" %}selected{% endif %}>10秒</option>
                    <option value="15" {% if last_used.confirm_wait == "15" %}selected{% endif %}>15秒</option>
                    <option value="20" {% if last_used.confirm_wait == "20" %}selected{% endif %}>20秒</option>
                    </select>
                </div>

                <!-- 実行ボタン -->
                <div class="row">
                    <label class="label"></label>
                    <div class="btn-row">
                    <button type="button" id="runBtn" class="btn-blue">実　行</button>
                    </div>
                </div>
            </div><!-- /.card -->
        </div><!-- /.card -->
    </div><!-- /#research --><!-- /.grid -->


    <!-- ✅ オプションタブ -->
    <div id="option" class="tab-content {% if tab == 'seller_id_extractor' %}active{% endif %}">
        <div class="card">
            <!-- 1. ASIN抽出：保存済みファイル一覧（チェック付き） -->
            <h2>保存済みファイル一覧（ASIN抽出用）</h2> 

            <!-- マーケットプレイス選択 -->
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                <div class="btn-row">
                    <button onclick="loadFileList()" class="btn-blue" style="margin-left:20px;">読　込</button>
                    <button id="asinExtractBtn" class="btn-blue" style="margin-left:20px;">ASIN抽出</button>
                </div>
            </div>

            <!-- ファイル一覧（チェックボックス付き） -->
            <div id="asin-file-list"></div>
        </div>    <!-- ASIN抽出用ファイル一覧ここまで -->
    </div> <!-- ✅ option タブの閉じタグ -->    
 

    <!-- ✅ JavaScriptの読み込み -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- ✅ マーケットプレイス切り替え処理
    <script>
    document.querySelectorAll('input[name="region"]').forEach(radio => {
        radio.addEventListener("change", function () {
            const selectedRegion = this.value;
            window.location.href = `/?region=${selectedRegion}`;
        });
    });
    
    </script> -->

</body>

</html>
